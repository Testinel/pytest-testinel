[project]
name = "pytest-testinel"
version = "0.8.5"
description = "Testinel’s pytest plugin captures structured Selenium and Playwright test execution data directly from pytest and sends it to Testinel, where your test results become searchable, comparable, and actually useful."
readme = "README.md"
requires-python = ">=3.11,<3.17"
authors = [
  { name="Volodymyr Obrizan", email="obrizan@first.institute" },
]
dependencies = [
    "pytest>=7",
    "requests>=2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://testinel.dev"
Repository = "https://github.com/Testinel/pytest-testinel"
Issues = "https://github.com/Testinel/pytest-testinel/issues"

[project.entry-points.pytest11]
myproject = "pytest_testinel.testinel"

[build-system]
requires = [
    "uv_build >= 0.9.18, <0.10.0",
    "ruff>=0.14.10",
    "twine>=6.2.0",
]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "ruff>=0.15.4",
    "tox>=4",
    "ty>=0.0.22",
    "types-requests>=2.32.4.20260107",
]
