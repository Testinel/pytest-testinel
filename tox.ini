[tox]
requires = tox>=4
env_list = py{311,312,313,314,315,316}-pytest{7,8,9}
skip_missing_interpreters = false

[testenv]
description = Run tests with {base_python} and {env_name}
package = wheel
deps =
    pytest7: pytest>=7,<8
    pytest8: pytest>=8,<9
    pytest9: pytest>=9,<10
set_env =
    TESTINEL_DSN =
commands = python -m pytest {posargs:tests}
